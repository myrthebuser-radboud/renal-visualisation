<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My 3D Model</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer { width: 100vw; height: 100vh; background: #f5f5f5; }
  </style>
</head>
<body>
  <model-viewer 
    src="Untitled.glb" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    alt="3D anatomical model">
  </model-viewer>
</body>
</html>
